<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dink Daily</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dink Daily">
<meta name="theme-color" content="#2f8f3a">
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1b2418;--mu:#6b7566;--ac:#2f8f3a;--ac2:#e8f4e5;--warn:#f08a1c;--bad:#c4452f;--bd:#e2e5dc}
@media (prefers-color-scheme:dark){:root{--bg:#121510;--card:#1c211a;--tx:#eef2ea;--mu:#9aa595;--ac:#58c264;--ac2:#243322;--bad:#ee7a64;--bd:#2c3329}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mu{color:var(--mu);font-size:14px}
.hero{display:flex;gap:12px;margin-top:12px}.hero .card{flex:1;text-align:center;margin:0;padding:12px 8px}
.big{font-size:30px;font-weight:700;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.ghost{background:var(--ac2);color:var(--ac)}
button.full{width:100%;padding:14px;font-size:17px;margin-top:16px}
.seg{display:flex;background:var(--ac2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;color:var(--ac);padding:10px}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:7px 12px;border-radius:99px;background:var(--ac2);color:var(--ac);font-size:14px;font-weight:600}
.chip.on{background:var(--ac);color:#fff}
.tag{font-size:12px;background:var(--ac2);color:var(--ac);padding:2px 8px;border-radius:99px;font-weight:600;display:inline-block;margin:2px 2px 0 0}
textarea,input[type=date],input[type=text],input[type=number]{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-weight:600;margin:14px 0 4px}
.stars button{background:none;color:var(--bd);font-size:34px;padding:0 4px}.stars button.on{color:var(--warn)}
.score{display:flex;align-items:center;gap:12px}
.score input{text-align:center;font-size:30px;font-weight:700;padding:10px 0}
.score span{font-weight:700;color:var(--mu)}
.res{font-weight:800;font-size:18px;width:28px;text-align:center}
.res.w{color:var(--ac)}.res.l{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 0;font-size:13px}
nav button.on{color:var(--ac)}nav span{display:block;font-size:22px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:4px}
.del{background:none;color:var(--mu);padding:2px 6px;font-size:13px;font-weight:400}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
let S={logs:[],games:[]};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('dinkdaily')))}catch(e){}
function fix(){
 if(!Array.isArray(S.logs))S.logs=[];if(!Array.isArray(S.games))S.games=[];
 S.logs.forEach((l,i)=>{if(!l.id)l.id=Date.now()+i});S.games.forEach((g,i)=>{if(!g.id)g.id=Date.now()+i});
}
fix();
const save=()=>{try{localStorage.setItem('dinkdaily',JSON.stringify(S))}catch(e){}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

const TYPES=['Practice','Open play','Lesson'];
const FOCUS=['Dinks','Drops','Serve','Return','Volleys','Resets','Footwork','Strategy','Patience','Communication'];
const BODY=[['😀','Great'],['🙂','OK'],['😬','Sore']];

// ---- State ----
let tab='log',mode='game',filter='all';
const freshS=()=>({type:'Practice',rating:0,tags:[],body:'',well:'',imp:'',date:key()});
const freshG=()=>({fmt:'Doubles',partner:'',o1:'',o2:'',me:'',them:'',note:'',date:key()});
let ss=freshS(),gm=freshG();
const isWin=g=>g.me>g.them;
window.go=t=>{tab=t;render();scrollTo(0,0)};

function render(){
 $('#nav').innerHTML=[['log','✏️','Log'],['history','📖','History'],['stats','📈','Stats']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 $('#app').innerHTML={log:vLog,history:vHistory,stats:vStats}[tab]();
 if(tab==='log'&&mode==='game')sug();
}

// ---- Name suggestions (tappable chips; more reliable than <datalist> on iPhone) ----
const fieldsFor=()=>gm.fmt==='Doubles'?['partner','o1','o2']:['o1'];
const fieldLabel=k=>k==='partner'?'partner':(gm.fmt==='Doubles'?(k==='o1'?'opponent 1':'opponent 2'):'opponent');
function activeField(){const f=fieldsFor();return f.includes(gm.f)?gm.f:(f.find(k=>!gm[k].trim())||f[0])}
function sug(){
 const el=$('#sug');if(!el)return;
 const f=activeField(),cnt={};
 S.games.forEach(g=>[g.partner,g.o1,g.o2].forEach(n=>n&&(cnt[n]=(cnt[n]||0)+1)));
 const used=fieldsFor().filter(k=>k!==f).map(k=>gm[k].trim().toLowerCase());
 const q=gm[f].trim().toLowerCase();
 const list=Object.keys(cnt).filter(n=>{const l=n.toLowerCase();return !used.includes(l)&&l!==q&&l.includes(q)})
  .sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b)).slice(0,8);
 el.innerHTML=list.length?`<span class="mu" style="width:100%">Tap to fill ${fieldLabel(f)}:</span>`+list.map(n=>`<button class="chip" data-n="${esc(n)}" onclick="pick(this.dataset.n)">${esc(n)}</button>`).join(''):'';
}
window.pick=n=>{
 const f=activeField();gm[f]=n;
 const inp=document.getElementById('in_'+f);if(inp)inp.value=n;
 const next=fieldsFor().find(k=>!gm[k].trim());
 gm.f=next||f;
 if(next){const ni=document.getElementById('in_'+next);if(ni)ni.focus()}
 sug();
};

// ---- Log ----
function vLog(){
 const g=S.games,w=g.filter(isWin).length;
 return`<div class="row"><h1>🥒 Dink Daily</h1><span class="mu">${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span></div>
 <div class="hero"><div class="card"><div class="big">${g.length}</div><div class="mu">games</div></div>
 <div class="card"><div class="big">${w}–${g.length-w}</div><div class="mu">record</div></div>
 <div class="card"><div class="big">${S.logs.length}</div><div class="mu">sessions</div></div></div>
 <div class="seg" style="margin-top:16px"><button class="${mode==='game'?'on':''}" onclick="mode='game';render()">🏓 Game</button><button class="${mode==='session'?'on':''}" onclick="mode='session';render()">📝 Session</button></div>
 ${mode==='game'?fGame():fSession()}`;
}

function fGame(){
 const dbl=gm.fmt==='Doubles';
 const nm=(id,k,ph)=>`<input type="text" id="in_${k}" placeholder="${ph}" value="${esc(gm[k])}" onfocus="gm.f='${k}';sug()" oninput="gm.${k}=this.value;sug()" autocapitalize="words" autocomplete="off" autocorrect="off">`;
 return`<div class="card">
 <div class="chips">${['Doubles','Singles'].map(f=>`<button class="chip ${gm.fmt===f?'on':''}" onclick="gm.fmt='${f}';render()">${f}</button>`).join('')}</div>
 <label>Who played?</label>
 <div style="display:grid;gap:8px">
  ${dbl?nm('p','partner','Your partner'):''}
  ${nm('o1','o1',dbl?'Opponent 1':'Opponent')}
  ${dbl?nm('o2','o2','Opponent 2'):''}
 </div>
 <div id="sug" class="chips" style="margin-top:8px"></div>
 <label>Score</label>
 <div class="score"><div style="flex:1"><div class="mu" style="text-align:center">Us</div><input type="number" inputmode="numeric" min="0" value="${esc(gm.me)}" oninput="gm.me=this.value"></div><span>–</span><div style="flex:1"><div class="mu" style="text-align:center">Them</div><input type="number" inputmode="numeric" min="0" value="${esc(gm.them)}" oninput="gm.them=this.value"></div></div>
 <label>Note <span class="mu" style="font-weight:400">(optional)</span></label>
 <textarea oninput="gm.note=this.value" placeholder="e.g. stayed patient at the kitchen, lost on 3rd-shot errors">${esc(gm.note)}</textarea>
 <label>Date</label><input type="date" value="${gm.date}" max="${key()}" onchange="gm.date=this.value||key()">
 <button class="full" onclick="saveGame()">Save game</button></div>`;
}
window.saveGame=()=>{
 const me=parseInt(gm.me,10),them=parseInt(gm.them,10);
 if(isNaN(me)||isNaN(them)){toast('Enter both scores');return}
 if(me===them){toast('Scores can\'t be tied');return}
 const dbl=gm.fmt==='Doubles';
 S.games.push({id:Date.now(),date:gm.date,fmt:gm.fmt,partner:dbl?gm.partner.trim():'',o1:gm.o1.trim(),o2:dbl?gm.o2.trim():'',me,them,note:gm.note.trim()});
 S.games.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
 save();
 // keep players & date for the next game, clear score and note
 gm=Object.assign(freshG(),{fmt:gm.fmt,partner:gm.partner,o1:gm.o1,o2:gm.o2,date:gm.date});
 toast(me>them?'Win logged 🎉':'Loss logged 💪');render();scrollTo(0,0)};

function fSession(){
 const stars=[1,2,3,4,5].map(i=>`<button class="${ss.rating>=i?'on':''}" onclick="ss.rating=${i};render()">★</button>`).join('');
 return`<div class="card">
 <div class="chips">${TYPES.map(t=>`<button class="chip ${ss.type===t?'on':''}" onclick="ss.type='${t}';render()">${t}</button>`).join('')}</div>
 <label>How did it go?</label><div class="stars">${stars}</div>
 <label>What went well</label><textarea oninput="ss.well=this.value" placeholder="e.g. third-shot drops were landing soft">${esc(ss.well)}</textarea>
 <label>What could use work</label><textarea oninput="ss.imp=this.value" placeholder="e.g. too many errors on speed-ups">${esc(ss.imp)}</textarea>
 <label>Focus areas <span class="mu" style="font-weight:400">(optional)</span></label>
 <div class="chips">${FOCUS.map(f=>`<button class="chip ${ss.tags.includes(f)?'on':''}" onclick="togTag('${f}')">${f}</button>`).join('')}</div>
 <label>How's the body?</label>
 <div class="chips">${BODY.map(([e,t])=>`<button class="chip ${ss.body===t?'on':''}" onclick="ss.body=ss.body==='${t}'?'':'${t}';render()">${e} ${t}</button>`).join('')}</div>
 <label>Date</label><input type="date" value="${ss.date}" max="${key()}" onchange="ss.date=this.value||key()">
 <button class="full" onclick="saveSession()">Save session</button></div>`;
}
window.togTag=f=>{const i=ss.tags.indexOf(f);i>=0?ss.tags.splice(i,1):ss.tags.push(f);render()};
window.saveSession=()=>{
 if(!ss.rating){toast('Pick a star rating');return}
 S.logs.push({id:Date.now(),date:ss.date,type:ss.type,rating:ss.rating,well:ss.well.trim(),imp:ss.imp.trim(),tags:ss.tags,body:ss.body});
 S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
 save();ss=freshS();toast('Session saved 🎉');render();scrollTo(0,0)};

// ---- History ----
window.delItem=(kind,id)=>{if(!confirm('Delete this entry?'))return;
 if(kind==='g')S.games=S.games.filter(x=>x.id!==id);else S.logs=S.logs.filter(x=>x.id!==id);save();render()};
const fmtDate=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});

function vHistory(){
 const items=[...S.games.map(g=>({k:'g',d:g.date,id:g.id,x:g})),...S.logs.map(l=>({k:'s',d:l.date,id:l.id,x:l}))]
  .filter(i=>filter==='all'||(filter==='games'?i.k==='g':i.k==='s'))
  .sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id);
 const chips=[['all','All'],['games','Games'],['sessions','Sessions']].map(([k,l])=>`<button class="chip ${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</button>`).join('');
 return`<h1>History</h1><div class="chips" style="margin-top:10px">${chips}</div>`+(items.length?items.map(i=>i.k==='g'?cGame(i.x):cSess(i.x)).join(''):`<div class="card mu">Nothing here yet. Log your first game or session on the Log tab.</div>`);
}
function cGame(g){
 const w=isWin(g),who=[g.partner&&'with '+esc(g.partner),'vs '+(esc([g.o1,g.o2].filter(Boolean).join(' & '))||'—')].filter(Boolean).join(' ');
 return`<div class="card"><div class="row"><div class="row" style="justify-content:flex-start"><span class="res ${w?'w':'l'}">${w?'W':'L'}</span><b style="font-size:20px">${g.me}–${g.them}</b></div><span class="mu">${fmtDate(g.date)}</span></div>
 <div style="margin-top:4px"><span class="tag">${esc(g.fmt||'Doubles')}</span> <span class="mu">${who}</span></div>
 ${g.note?`<div style="margin-top:6px">📝 ${esc(g.note)}</div>`:''}
 <div style="text-align:right"><button class="del" onclick="delItem('g',${g.id})">Delete</button></div></div>`;
}
function cSess(l){
 return`<div class="card"><div class="row"><b>${esc(l.type)}</b><span class="mu">${fmtDate(l.date)}</span></div>
 <div style="color:var(--warn);font-size:18px">${'★'.repeat(l.rating)}${'☆'.repeat(5-l.rating)}</div>
 ${l.well?`<div style="margin-top:4px">👍 ${esc(l.well)}</div>`:''}${l.imp?`<div style="margin-top:4px">🎯 ${esc(l.imp)}</div>`:''}
 <div style="margin-top:6px">${(l.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${l.body?`<span class="tag">Body: ${esc(l.body)}</span>`:''}</div>
 <div style="text-align:right"><button class="del" onclick="delItem('s',${l.id})">Delete</button></div></div>`;
}

// ---- Stats ----
function vStats(){
 const G=S.games,w=G.filter(isWin).length,L=G.length-w;
 const pct=G.length?Math.round(w/G.length*100)+'%':'–';
 const last10=G.slice(-10),w10=last10.filter(isWin).length;
 const avg=S.logs.length?(S.logs.reduce((a,x)=>a+x.rating,0)/S.logs.length).toFixed(1):'–';
 const trend=S.logs.slice(-10);
 const cnt={};S.logs.slice(-20).forEach(l=>(l.tags||[]).forEach(t=>cnt[t]=(cnt[t]||0)+1));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4);
 const imps=S.logs.filter(x=>x.imp).slice(-3).reverse();
 const sore=S.logs.slice(-10).filter(l=>l.body==='Sore').length;
 // partner records
 const pr={};G.forEach(g=>{if(g.partner){const p=pr[g.partner]||(pr[g.partner]={w:0,l:0});isWin(g)?p.w++:p.l++}});
 const partners=Object.entries(pr).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)||a[0].localeCompare(b[0]));
 return`<h1>Stats</h1>
 <div class="hero"><div class="card"><div class="big">${G.length}</div><div class="mu">games logged</div></div><div class="card"><div class="big">${S.logs.length}</div><div class="mu">sessions logged</div></div></div>
 <div class="hero"><div class="card"><div class="big">${w}–${L}</div><div class="mu">win–loss${G.length?` · ${pct}`:''}</div></div><div class="card"><div class="big">${avg}${avg!=='–'?'<span style="font-size:18px;color:var(--warn)"> ★</span>':''}</div><div class="mu">avg session rating</div></div></div>
 ${last10.length>1?`<div class="card"><b>Last ${last10.length} games:</b> ${w10}–${last10.length-w10}<div style="margin-top:8px">${last10.map(g=>`<span class="res ${isWin(g)?'w':'l'}" style="display:inline-block;font-size:16px">${isWin(g)?'W':'L'}</span>`).join('')}</div></div>`:''}
 ${partners.length?`<h2>Partners</h2><div class="card">${partners.map(([n,v])=>`<div class="row" style="padding:3px 0"><span>${esc(n)}</span><b>${v.w}–${v.l}</b></div>`).join('')}</div>`:''}
 ${trend.length>1?`<div class="card"><b>Session rating trend</b><div class="bars">${trend.map(l=>`<div style="height:${l.rating*20}%" title="${l.date}"></div>`).join('')}</div><div class="mu">Last ${trend.length} sessions</div></div>`:''}
 ${top.length?`<h2>Most frequent focus areas</h2><div class="card">${top.map(([t,c])=>`<span class="tag">${esc(t)} · ${c}</span>`).join('')}<div class="mu" style="margin-top:6px">From your last 20 sessions.</div></div>`:''}
 ${sore>=3?`<div class="card">⚠️ You've felt sore in ${sore} of your last ${Math.min(10,S.logs.length)} sessions. Consider an extra rest day or easing off the intensity.</div>`:''}
 ${imps.length?`<h2>Recent "could use work" notes</h2>${imps.map(x=>`<div class="card">🎯 ${esc(x.imp)}<div class="mu">${fmtDate(x.date)}</div></div>`).join('')}`:''}
 <h2>Data</h2><div class="card"><div class="mu">Saved on this device. Back it up:</div><div style="margin-top:8px;display:flex;gap:8px"><button class="ghost" onclick="exp()">Export</button><button class="ghost" onclick="document.getElementById('imp').click()">Import</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this.files[0])"></div></div>`;
}
window.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='dink-daily-backup.json';a.click()};
window.imp=f=>{if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.logs)&&!Array.isArray(d.games))throw 0;S=Object.assign({logs:[],games:[]},d);fix();save();toast('Imported');render()}catch(e){toast('Invalid file')}})};
render();
</script></body></html>
